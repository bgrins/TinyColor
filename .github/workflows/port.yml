name: TinyColor Go port

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: make verify
      - run: deno test test.js
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: tinycolor-linux-amd64
          path: bin/tinycolor
